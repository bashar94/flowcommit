name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The editor tests drive the Google Chrome that GitHub's Ubuntu runners come with.
      - name: Editor tests
        run: npm run test:e2e
        env:
          GIT_AUTHOR_NAME: CI
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: CI
          GIT_COMMITTER_EMAIL: ci@example.com
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: editor-test-results
          path: test-results/
          retention-days: 7
