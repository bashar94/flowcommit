# Weekly pull requests for security fixes and updates, grouped so they're easy to review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: later versions draw exported pictures wrongly with React Flow.
      - dependency-name: html-to-image
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
